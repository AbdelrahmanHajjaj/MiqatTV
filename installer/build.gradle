// Standalone host; the companion uses the same installer-runtime implementation.
plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.miqat.installer.app'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.miqat.installer'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main {
        java.srcDirs = []
        res.srcDirs = []
        assets.srcDirs = []
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

dependencies {
    implementation project(':installer-runtime')
}

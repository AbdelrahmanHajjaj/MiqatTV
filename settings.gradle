pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Only for the shared installer's ADB library and its SPAKE2 dependency.
        maven {
            url 'https://jitpack.io'
            content { includeGroupByRegex 'com\\.github\\.MuntashirAkon.*' }
        }
    }
}
rootProject.name = "Miqat"
include ':app'
project(':app').projectDir = file('platforms/android-tv')
include ':installer-runtime'
project(':installer-runtime').projectDir = file('installer/runtime')
includeBuild('shared/core')
include ':companion'
project(':companion').projectDir = file('companion/android')
includeBuild('companion/core') { name = 'companion-core' }

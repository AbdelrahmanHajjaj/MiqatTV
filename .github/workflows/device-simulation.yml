name: Device simulation
run-name: Device simulation · ${{ inputs.staging_tag || 'Latest Staging' }}

on:
  workflow_dispatch:
    inputs:
      staging_tag:
        description: Full Staging tag (blank uses latest published Staging)
        type: string
  workflow_call:
    inputs:
      staging_tag:
        type: string
        required: true
      source:
        type: string
        required: true
      manifest:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      source: ${{ steps.resolve.outputs.source }}
      manifest: ${{ steps.resolve.outputs.manifest }}
    steps:
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the Staging candidate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_TAG: ${{ inputs.staging_tag }}
          SOURCE_SHA: ${{ inputs.source }}
          ASSET_MANIFEST: ${{ inputs.manifest }}
        run: |
          if [[ -n "$SOURCE_SHA" ]]; then
            printf 'tag=%s\nsource=%s\nmanifest=%s\n' "$STAGING_TAG" "$SOURCE_SHA" "$ASSET_MANIFEST" >> "$GITHUB_OUTPUT"
          else
            python3 -S -B -m tools.release_source resolve
          fi

  android:
    name: ${{ matrix.device }} emulator (${{ matrix.profile }}) · ${{ needs.source.outputs.tag }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: Miqat Phone
            target: phone
            profile: pixel_6
            apk: miqat-phone.apk
            module: companion
          - device: Android TV
            target: tv
            profile: pixel_2
            apk: miqat.apk
            module: app
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_TAG: ${{ needs.source.outputs.tag }}
      ASSET_MANIFEST: ${{ needs.source.outputs.manifest }}
      DEVICE: ${{ matrix.target }}
      APK: ${{ matrix.apk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Download signed candidate and build same-source instrumentation
        env:
          MODULE: ${{ matrix.module }}
        run: |
          python3 -S -B -m tools.promote_release download state/release "$APK"
          python3 tools/check_android_release.py "$ANDROID_HOME/build-tools/35.0.0" "state/release/$APK"
          cd candidate
          ./gradlew ":$MODULE:assembleDebug" ":$MODULE:assembleDebugAndroidTest" --no-daemon
      - name: Allow the runner to use KVM
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Required · Android simulation attempt 1
        id: first
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          SIMULATION_ATTEMPT: '1'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          avd-name: miqat-attempt-1
          emulator-port: 5554
          disable-animations: true
          script: bash tools/device-simulation.sh "$DEVICE" "state/release/$APK"
      - name: Required · Android simulation attempt 2
        if: steps.first.outcome == 'failure' && hashFiles('state/device-simulation/blocking-failure') == ''
        id: second
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          SIMULATION_ATTEMPT: '2'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          avd-name: miqat-attempt-2
          emulator-port: 5556
          disable-animations: true
          script: bash tools/device-simulation.sh "$DEVICE" "state/release/$APK"
      - name: Required · Android simulation attempt 3
        if: steps.second.outcome == 'failure' && hashFiles('state/device-simulation/blocking-failure') == ''
        id: third
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          SIMULATION_ATTEMPT: '3'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          avd-name: miqat-attempt-3
          emulator-port: 5558
          disable-animations: true
          script: bash tools/device-simulation.sh "$DEVICE" "state/release/$APK"
      - name: Required · Verify Android simulation result
        if: ${{ !cancelled() }}
        env:
          ATTEMPT_1: ${{ steps.first.outcome }}
          ATTEMPT_2: ${{ steps.second.outcome }}
          ATTEMPT_3: ${{ steps.third.outcome }}
        run: |
          printf '### Required %s simulation\n\nAttempts (1–3): %s, %s, %s\n' \
            "$DEVICE" "$ATTEMPT_1" "$ATTEMPT_2" "$ATTEMPT_3" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f state/device-simulation/blocking-failure ]]; then
            cat state/device-simulation/blocking-failure | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$ATTEMPT_2" == success || "$ATTEMPT_3" == success ]]; then
            echo '::warning::Required simulation recovered on a fresh emulator'
          fi
          [[ "$ATTEMPT_1" == success || "$ATTEMPT_2" == success || "$ATTEMPT_3" == success ]]
      - name: Advisory · Upload Android simulation diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: ${{ matrix.target }}-simulation
          path: state/device-simulation/
          if-no-files-found: ignore
          retention-days: 7

  webos:
    name: LG webOS browser mock · ${{ needs.source.outputs.tag }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_TAG: ${{ needs.source.outputs.tag }}
      ASSET_MANIFEST: ${{ needs.source.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Unpack the verified Staging IPK
        run: |
          python3 -S -B -m tools.promote_release download state/release '*.ipk'
          mkdir -p state/ipk candidate/platforms/webos/build
          ar p state/release/*.ipk data.tar.gz | tar -xzf - -C state/ipk
          mv state/ipk/usr/palm/applications/tv.miqat.webos candidate/platforms/webos/build/app
          mv state/ipk/usr/palm/services/tv.miqat.webos.service candidate/platforms/webos/build/service
      - run: npm --prefix candidate/platforms/webos ci --ignore-scripts
      - run: npm --prefix candidate/platforms/webos run test:browser

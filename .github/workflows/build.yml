name: Build
run-name: Build · ${{ inputs.channel }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel
        required: true
        type: choice
        options: [development, staging]

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.channel }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main for Staging
        if: inputs.channel == 'staging'
        run: test "$GITHUB_REF" = refs/heads/main

  build:
    needs: source
    uses: ./.github/workflows/validate.yml
    with:
      channel: ${{ inputs.channel }}

  staging:
    name: Publish Staging candidate
    needs: build
    if: inputs.channel == 'staging' && github.ref == 'refs/heads/main'
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate Staging tag
        id: source
        run: python3 -S -B -m tools.release_source next
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phone-staging
          path: state/downloads/phone
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-tv-staging
          path: state/downloads/android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lg-staging
          path: state/downloads/webos
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - name: Verify installed Android signing tools
        run: |
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Sign release APKs with persistent keys
        env:
          MIQAT_SIGNING_KEYSTORE_BASE64: ${{ secrets.MIQAT_SIGNING_KEYSTORE_BASE64 }}
          MIQAT_SIGNING_PASSWORD: ${{ secrets.MIQAT_SIGNING_PASSWORD }}
        run: |
          set -eu
          test -n "$MIQAT_SIGNING_KEYSTORE_BASE64" && test -n "$MIQAT_SIGNING_PASSWORD"
          umask 077
          key="$RUNNER_TEMP/miqat-release.keystore"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$MIQAT_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key"
          mkdir -p state/unsigned-release state/release
          cp state/downloads/android/miqat.apk state/unsigned-release/miqat.apk
          cp state/downloads/phone/companion-release-unsigned.apk state/unsigned-release/miqat-phone.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          while read -r filename alias; do
            "$tools/zipalign" -P 16 -f 4 "state/unsigned-release/$filename" "$RUNNER_TEMP/aligned-$filename"
            "$tools/apksigner" sign --ks "$key" --ks-key-alias "$alias" \
              --ks-pass env:MIQAT_SIGNING_PASSWORD --key-pass env:MIQAT_SIGNING_PASSWORD \
              --out "state/release/$filename" "$RUNNER_TEMP/aligned-$filename"
          done < <(python3 -c 'import json; c=json.load(open("tools/release-certificates.json")); [print(name, entry["alias"]) for name, entry in c.items()]')
          python3 tools/check_android_release.py "$tools" state/release/miqat.apk state/release/miqat-phone.apk
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/miqat-release.keystore"
      - name: Package reviewed screenshots and verify release assets
        run: |
          cp state/downloads/webos/*.ipk state/release/
          python3 tools/check_apk_media.py state/release/miqat.apk
          python3 tools/check_apk_media.py state/release/miqat-phone.apk
          git archive --format=zip --output=state/release/screenshots.zip "$GITHUB_SHA" docs/screenshots
      - name: Publish signed Staging packages
        working-directory: state/release
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          packages=(miqat.apk miqat-phone.apk tv.miqat.webos_*_all.ipk screenshots.zip)
          test "${#packages[@]}" -eq 4
          sha256sum -- "${packages[@]}" > SHA256SUMS
          printf 'Miqat Phone, Android TV and LG webOS.\n\nBuild: https://github.com/%s/actions/runs/%s\n\nSource: %s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > ../release-notes.md
          gh release create "$RELEASE_TAG" "${packages[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false --title "Miqat $RELEASE_TAG" \
            --notes-file ../release-notes.md
          printf '## Staging release\n\n[%s](https://github.com/%s/releases/tag/%s)\n' \
            "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

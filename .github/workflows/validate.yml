name: Validate
run-name: "Validate · ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.number, github.head_ref) || format('{0} · {1}', inputs.channel, github.ref_name) }}"

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      version_name:
        type: string
      version_code:
        type: string
      phone:
        type: boolean
        default: true
      android:
        type: boolean
        default: true
      webos:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: validate-${{ inputs.channel || 'pr' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.select.outputs.core }}
      android: ${{ steps.select.outputs.android }}
      webos: ${{ steps.select.outputs.webos }}
      preview: ${{ steps.select.outputs.preview }}
      companion: ${{ steps.select.outputs.companion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Lint workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test CI and release gates
        run: |
          python3 -S -B -m unittest discover -s tests -p test_ci.py -v
          python3 -S -B -m unittest discover -s tests -p test_release*.py -v
          python3 -S -B -m unittest discover -s tests -p test_delivery.py -v
          python3 -S -B -m unittest discover -s tests -p test_stable_promotion.py -v
      - name: Check PR whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Select affected consumers
        id: select
        env:
          BUILD_CHANNEL: ${{ inputs.channel }}
          BUILD_PHONE: ${{ inputs.phone }}
          BUILD_ANDROID_TV: ${{ inputs.android }}
          BUILD_WEBOS: ${{ inputs.webos }}
        run: python3 -S -B tools/ci.py select
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: contains(toJSON(steps.select.outputs), 'true')
        with:
          node-version: 24
      - name: Check canonical sources and complete media before builds can regenerate them
        if: contains(toJSON(steps.select.outputs), 'true')
        run: |
          node tools/catalogs.mjs --check
          node tools/catalogs.test.mjs
          node tools/validate-shared.test.mjs
          sha256sum --check shared/media/SHA256SUMS
          node tools/prepare-adhans.mjs --check

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shared/core/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: npm --prefix shared/core ci --ignore-scripts
      - name: Test JVM, Java and ES5 core
        run: ./gradlew -p shared/core check jvmJar --no-daemon

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    name: Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and lint standalone Android TV
        env:
          MIQAT_RELEASE_VERSION: ${{ inputs.version_name }}
          MIQAT_RELEASE_CODE: ${{ inputs.version_code }}
        run: |
          ./gradlew -p platforms/android-tv verifyApkSize lintDebug assembleDebugAndroidTest assembleRelease lintRelease --no-daemon
          python3 tools/check_apk_media.py platforms/android-tv/build/outputs/apk/debug/app-debug.apk
          python3 tools/check_apk_media.py platforms/android-tv/build/outputs/apk/release/app-release-unsigned.apk
      - name: Run Java and setup/recovery regressions
        run: python3 -S -B -m unittest discover -s tests -v
      - name: Collect the selected Android TV APK
        id: package
        if: inputs.channel != ''
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          mkdir -p state/builds/android
          if [[ "$CHANNEL" == development ]]; then
            cp platforms/android-tv/build/outputs/apk/debug/app-debug.apk state/builds/android/miqat.apk
          else
            cp platforms/android-tv/build/outputs/apk/release/app-release-unsigned.apk state/builds/android/miqat.apk
          fi
          version=$(python3 tools/check_android_release.py "$ANDROID_HOME/build-tools/35.0.0" \
            state/builds/android/miqat.apk --version-for tv.miqat.home)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.channel != ''
        with:
          name: android-tv-${{ inputs.channel }}
          path: state/builds/android/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-reports
          path: |
            platforms/android-tv/build/reports/
          retention-days: 7

  webos:
    needs: changes
    if: needs.changes.outputs.webos == 'true'
    name: LG build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/core/package-lock.json
            platforms/webos/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: npm --prefix shared/core ci --ignore-scripts
      - run: npm --prefix platforms/webos ci --ignore-scripts
      - name: Check all media and LG ES5/service behavior
        env:
          MIQAT_RELEASE_VERSION: ${{ inputs.version_name }}
        run: |
          sha256sum --check shared/media/SHA256SUMS
          npm --prefix platforms/webos test
      - name: Check LG startup and bilingual Settings in a browser
        if: github.event_name == 'pull_request'
        run: npm --prefix platforms/webos run test:browser -- --smoke
      - name: Package full-audio LG app and service
        id: package
        run: |
          mkdir -p state/builds/webos
          npm exec --yes --package=@webos-tools/cli@3.2.6 -- ares-package platforms/webos/build/app platforms/webos/build/service --outdir state/builds/webos --no-minify
          version=$(node -p 'require("./platforms/webos/build/app/appinfo.json").version')
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.channel != ''
        with:
          name: lg-${{ inputs.channel }}
          path: state/builds/webos/*.ipk
          if-no-files-found: error
          retention-days: 7

  preview:
    needs: changes
    if: needs.changes.outputs.preview == 'true'
    name: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            shared/core/package-lock.json
            site/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: npm --prefix shared/core ci --ignore-scripts
      - run: npm --prefix site ci --ignore-scripts
      - name: Check projections before generators can rewrite them
        run: |
          npm --prefix site run data:check
          npm --prefix site run tokens:check
      - run: npm --prefix site test
      - run: npm --prefix site run build
      - run: npm --prefix site run test:browser -- --showcase-only

  companion:
    name: Miqat Phone
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify and build with approved shared recordings
        env:
          MIQAT_RELEASE_VERSION: ${{ inputs.version_name }}
          MIQAT_RELEASE_CODE: ${{ inputs.version_code }}
        run: |
          node companion/generate.test.mjs
          node companion/qr.test.cjs
          node companion/android-shared/check.mjs
          ./gradlew -p companion/core check jvmJar --no-daemon
          ./gradlew :companion:assembleDebug :companion:lintDebug :companion:assembleDebugAndroidTest :companion:assembleRelease :companion:lintRelease --no-daemon
          python3 tools/check_apk_media.py companion/android/build/outputs/apk/debug/companion-debug.apk
          python3 tools/check_apk_media.py companion/android/build/outputs/apk/release/companion-release-unsigned.apk
      - name: Collect the selected Miqat Phone APK
        id: package
        if: inputs.channel != ''
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "$CHANNEL" == development ]]; then
            mkdir -p state/builds/phone
            apk=state/builds/phone/miqat-phone.apk
            cp companion/android/build/outputs/apk/debug/companion-debug.apk "$apk"
          else
            apk=companion/android/build/outputs/apk/release/companion-release-unsigned.apk
          fi
          version=$(python3 tools/check_android_release.py "$ANDROID_HOME/build-tools/35.0.0" \
            "$apk" --version-for tv.miqat.companion)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.channel == 'development'
        with:
          name: phone-development
          path: state/builds/phone/miqat-phone.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.channel == 'staging'
        with:
          name: phone-staging
          path: companion/android/build/outputs/apk/release/companion-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required checks
    if: always()
    needs: [changes, core, android, webos, preview, companion]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every applicable validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -S -B tools/ci.py require
      - name: Show built app versions
        if: inputs.channel != ''
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version_name }}
          RELEASE_CODE: ${{ inputs.version_code }}
          PHONE_VERSION: ${{ needs.companion.outputs.version }}
          TV_VERSION: ${{ needs.android.outputs.version }}
          LG_VERSION: ${{ needs.webos.outputs.version }}
          PHONE_SELECTED: ${{ needs.changes.outputs.companion }}
          TV_SELECTED: ${{ needs.changes.outputs.android }}
          LG_SELECTED: ${{ needs.changes.outputs.webos }}
        run: |
          if [[ "$PHONE_SELECTED" == true ]]; then test -n "$PHONE_VERSION"; fi
          if [[ "$TV_SELECTED" == true ]]; then test -n "$TV_VERSION"; fi
          if [[ "$LG_SELECTED" == true ]]; then test -n "$LG_VERSION"; fi
          if [[ "$CHANNEL" == staging ]]; then
            test -n "$RELEASE_VERSION"
            test -n "$RELEASE_CODE"
            test "$PHONE_VERSION" = "$RELEASE_VERSION (code $RELEASE_CODE)"
            test "$TV_VERSION" = "$PHONE_VERSION"
            test "$LG_VERSION" = "$RELEASE_VERSION"
          fi
          {
            printf '## Built app versions\n\n'
            printf '| App | Version |\n| --- | --- |\n'
            printf '| Miqat Phone | %s |\n| Android TV | %s |\n| LG webOS | %s |\n' \
              "${PHONE_VERSION:-Not selected}" "${TV_VERSION:-Not selected}" "${LG_VERSION:-Not selected}"
          } >> "$GITHUB_STEP_SUMMARY"

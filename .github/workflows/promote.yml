name: Promote to Production
run-name: Promote to Production · ${{ inputs.staging_tag || 'Latest Staging' }}

on:
  workflow_dispatch:
    inputs:
      staging_tag:
        description: Full Staging tag (blank uses latest). Running this workflow approves live publication.
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      source: ${{ steps.resolve.outputs.source }}
      production: ${{ steps.resolve.outputs.production }}
      manifest: ${{ steps.resolve.outputs.manifest }}
    steps:
      - name: Require main for Production
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the Staging candidate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_TAG: ${{ inputs.staging_tag }}
        run: python3 -S -B -m tools.release_source resolve

  simulation:
    needs: source
    uses: ./.github/workflows/device-simulation.yml
    permissions:
      contents: read
      actions: read
    with:
      staging_tag: ${{ needs.source.outputs.tag }}
      source: ${{ needs.source.outputs.source }}
      manifest: ${{ needs.source.outputs.manifest }}

  website:
    name: Prepare the Production website
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_TAG: ${{ needs.source.outputs.tag }}
      ASSET_MANIFEST: ${{ needs.source.outputs.manifest }}
      PRODUCTION_TAG: ${{ needs.source.outputs.production }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Reuse verified release screenshots and APK versions
        run: |
          python3 -S -B -m tools.promote_release download state/release
          python3 -S -B -m tools.promote_release website state/release candidate
      - name: Build and verify public website
        working-directory: candidate
        run: |
          npm --prefix shared/core ci --ignore-scripts
          npm --prefix site ci --ignore-scripts
          npm --prefix site run build
          npm --prefix site run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-assets
          path: state/release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: candidate/site/dist
          retention-days: 7

  publish:
    name: Publish Production · ${{ needs.source.outputs.production }}
    needs: [source, simulation, website]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      STAGING_TAG: ${{ needs.source.outputs.tag }}
      ASSET_MANIFEST: ${{ needs.source.outputs.manifest }}
      SOURCE_SHA: ${{ needs.source.outputs.source }}
      PRODUCTION_TAG: ${{ needs.source.outputs.production }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-assets
          path: state/release
      - run: python3 -S -B -m tools.promote_release publish state/release

  pages:
    name: Deploy the Production website
    needs: [source, publish]
    concurrency: pages-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require this candidate to still be the latest Production release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_TAG: ${{ needs.source.outputs.production }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$PRODUCTION_TAG"
      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Companion
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify and build with approved shared recordings
        run: |
          chmod +x gradlew
          node tools/catalogs.mjs --check
          node companion/generate.test.mjs
          node companion/qr.test.cjs
          node companion/android-shared/check.mjs
          ./gradlew -p companion/core check jvmJar --no-daemon
          ./gradlew :companion:assembleDebug :companion:lintDebug :companion:assembleDebugAndroidTest --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native settings and LAN regressions
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r companion/android/build/outputs/apk/debug/companion-debug.apk
            adb install -r -t companion/android/build/outputs/apk/androidTest/debug/companion-debug-androidTest.apk
            adb shell am instrument -r -w tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee companion-ui-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' companion-ui-result.log
            grep -q 'PASS: bilingual native bindings' companion-ui-result.log
            adb shell am instrument -r -w -e suite lan tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee companion-lan-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' companion-lan-result.log
            grep -q 'PASS: pinned TLS' companion-lan-result.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: companion-debug
          path: companion/android/build/outputs/apk/debug/companion-debug.apk
          if-no-files-found: error
          retention-days: 7

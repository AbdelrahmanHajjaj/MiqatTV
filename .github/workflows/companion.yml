name: Companion
on:
  pull_request:
    paths: ['companion/**', 'shared/core/**', 'shared/data/**', 'shared/design/**', 'shared/media/**', 'shared/design/mihrab/tokens.json', 'tools/ui-contract.mjs', 'tools/branding.mjs', 'tools/catalogs.mjs', 'platforms/**/ui-gaps.json', 'platforms/**/ui-choice-gaps.json', 'settings.gradle', 'build.gradle', 'gradle/**', '.github/workflows/companion.yml']
  push:
    branches: [main]
    paths: ['companion/**', 'shared/core/**', 'shared/data/**', 'shared/design/**', 'shared/media/**', 'shared/design/mihrab/tokens.json', 'tools/ui-contract.mjs', 'tools/branding.mjs', 'tools/catalogs.mjs', 'platforms/**/ui-gaps.json', 'platforms/**/ui-choice-gaps.json', 'settings.gradle', 'build.gradle', 'gradle/**', '.github/workflows/companion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify and build with approved shared recordings
        run: |
          chmod +x gradlew
          node tools/catalogs.mjs --check
          node companion/generate.test.mjs
          node companion/qr.test.cjs
          node companion/android-shared/check.mjs
          ./gradlew -p companion/core check jvmJar --no-daemon
          ./gradlew :companion:assembleDebug :companion:lintDebug :companion:assembleDebugAndroidTest --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native settings and LAN regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r companion/android/build/outputs/apk/debug/companion-debug.apk
            adb install -r -t companion/android/build/outputs/apk/androidTest/debug/companion-debug-androidTest.apk
            adb shell am instrument -w tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee companion-ui-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' companion-ui-result.log
            grep -q 'PASS: bilingual native bindings' companion-ui-result.log
            adb shell am instrument -w -e suite lan tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee companion-lan-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' companion-lan-result.log
            grep -q 'PASS: pinned TLS' companion-lan-result.log
      - uses: actions/upload-artifact@v4
        with:
          name: companion-debug
          path: companion/android/build/outputs/apk/debug/companion-debug.apk

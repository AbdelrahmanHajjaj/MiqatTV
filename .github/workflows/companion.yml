name: Companion
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify and build with approved shared recordings
        run: |
          chmod +x gradlew
          node tools/catalogs.mjs --check
          node companion/generate.test.mjs
          node companion/qr.test.cjs
          node companion/android-shared/check.mjs
          ./gradlew -p companion/core check jvmJar --no-daemon
          ./gradlew :companion:assembleDebug :companion:lintDebug :companion:assembleDebugAndroidTest --no-daemon
          python3 tools/check_apk_media.py companion/android/build/outputs/apk/debug/companion-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native settings and LAN regressions
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            trap 'mkdir -p state; adb pull /sdcard/Android/data/tv.miqat.companion/files/adhan-swipe-failure.png state/adhan-swipe-failure.png >/dev/null 2>&1 || true' EXIT
            # A cold Google APIs image can leave Pixel Launcher ANR covering the test app.
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb install -r companion/android/build/outputs/apk/debug/companion-debug.apk
            adb install -r -t companion/android/build/outputs/apk/androidTest/debug/companion-debug-androidTest.apk
            timeout 420s adb shell am instrument -r -w -e suite phone-journey tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee phone-journey-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' phone-journey-result.log
            grep -q 'PASS: bilingual fresh-use' phone-journey-result.log
            timeout 420s adb shell am instrument -r -w -e suite phone-custom tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee phone-custom-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' phone-custom-result.log
            grep -q 'PASS: v1 migration' phone-custom-result.log
            timeout 90s adb shell am instrument -r -w -e suite phone-background-denied tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee phone-background-denied-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' phone-background-denied-result.log
            grep -q 'PASS: phone-background-denied' phone-background-denied-result.log
            timeout 420s adb shell am instrument -r -w -e suite public-release tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee public-release-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' public-release-result.log
            grep -q 'PASS: public release selection' public-release-result.log
            timeout 420s adb shell am instrument -r -w -e suite phone-location-denied tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee phone-location-denied-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' phone-location-denied-result.log
            grep -q 'PASS: denied foreground location' phone-location-denied-result.log
            adb shell pm grant tv.miqat.companion android.permission.ACCESS_COARSE_LOCATION
            adb shell cmd location set-location-enabled true
            adb shell appops set tv.miqat.companion android:mock_location allow
            timeout 420s adb shell am instrument -r -w -e suite phone-location-approx tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee phone-location-approx-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' phone-location-approx-result.log
            grep -q 'PASS: bilingual one-shot location' phone-location-approx-result.log
            adb shell pm grant tv.miqat.companion android.permission.ACCESS_FINE_LOCATION
            timeout 420s adb shell am instrument -r -w -e suite phone-location tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee phone-location-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' phone-location-result.log
            grep -q 'PASS: bilingual one-shot location' phone-location-result.log
            adb shell pm grant tv.miqat.companion android.permission.ACCESS_BACKGROUND_LOCATION
            adb emu geo fix -0.1278 51.5074
            timeout 90s adb shell am instrument -r -w -e suite phone-background-prepare tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee phone-background-prepare-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' phone-background-prepare-result.log
            grep -q 'PASS: phone-background-prepare' phone-background-prepare-result.log
            adb shell am kill tv.miqat.companion
            test -z "$(adb shell pidof tv.miqat.companion)"
            adb emu geo fix -0.1278 51.5074
            adb shell cmd jobscheduler run -f tv.miqat.companion 41703
            sleep 22
            timeout 90s adb shell am instrument -r -w -e suite phone-background-verify tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee phone-background-verify-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' phone-background-verify-result.log
            grep -q 'PASS: phone-background-verify' phone-background-verify-result.log
            adb shell pm revoke tv.miqat.companion android.permission.ACCESS_BACKGROUND_LOCATION
            timeout 420s adb shell am instrument -r -w tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee companion-ui-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' companion-ui-result.log
            grep -q 'PASS: bilingual native bindings' companion-ui-result.log
            timeout 420s adb shell am instrument -r -w -e suite lan tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee companion-lan-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' companion-lan-result.log
            grep -q 'PASS: pinned TLS' companion-lan-result.log
            timeout 420s adb shell am instrument -r -w -e suite phone-ui tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee phone-ui-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' phone-ui-result.log
            grep -q 'PASS: independent bilingual' phone-ui-result.log
            timeout 420s adb shell am instrument -r -w -e suite phone-size -e orientation portrait tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee phone-size-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' phone-size-result.log
            grep -q 'PASS: bilingual phone sizing' phone-size-result.log
            adb shell appops set tv.miqat.companion SCHEDULE_EXACT_ALARM deny
            timeout 420s adb shell am instrument -r -w -e suite phone-denied tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee phone-denied-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' phone-denied-result.log
            grep -q 'PASS: denied prayer permissions' phone-denied-result.log
            adb shell pm grant tv.miqat.companion android.permission.POST_NOTIFICATIONS
            adb shell appops set tv.miqat.companion SCHEDULE_EXACT_ALARM allow
            timeout 420s adb shell am instrument -r -w -e suite phone-runtime tv.miqat.companion.test/tv.miqat.companion.CompanionCheck | tee phone-runtime-result.log
            grep -q '^INSTRUMENTATION_CODE: -1' phone-runtime-result.log
            grep -q 'PASS: phone actual alarm delivery' phone-runtime-result.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: phone-swipe-failure
          path: state/adhan-swipe-failure.png
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: companion-debug
          path: companion/android/build/outputs/apk/debug/companion-debug.apk
          if-no-files-found: error
          retention-days: 7

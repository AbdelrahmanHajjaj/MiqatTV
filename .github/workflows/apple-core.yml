name: Apple core
on:
  pull_request:
    paths: ['shared/core/**', 'companion/core/**', 'gradle/**', '.github/workflows/apple-core.yml']
  push:
    branches: [main]
    paths: ['shared/core/**', 'companion/core/**', 'gradle/**', '.github/workflows/apple-core.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-rules:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Native rule tests and iOS library compilation
        run: |
          chmod +x gradlew
          ./gradlew -p shared/core -PmiqatApple=true macosArm64Test compileKotlinIosArm64 compileKotlinIosSimulatorArm64 --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g
          ./gradlew -p companion/core -PmiqatApple=true macosArm64Test compileKotlinIosArm64 compileKotlinIosSimulatorArm64 --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g

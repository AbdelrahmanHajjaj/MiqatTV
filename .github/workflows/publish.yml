name: Draft build release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Validate run ID for the current main commit
        required: true
        type: string
      tag:
        description: Version tag, for example v0.7.0-preview.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  publish:
    name: Create draft prerelease
    if: github.ref == 'refs/heads/main'
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the source before downloading artifacts
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Run ID must be numeric'; exit 1; }
          mkdir -p state/release
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > state/release-run.json
          python3 tools/release_source.py state/release-run.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: companion-release
          path: state/downloads/phone
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-builds
          path: state/downloads/android
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webos-build
          path: state/downloads/webos
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - name: Verify installed Android signing tools
        run: |
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Sign release APKs with persistent keys
        env:
          MIQAT_SIGNING_KEYSTORE_BASE64: ${{ secrets.MIQAT_SIGNING_KEYSTORE_BASE64 }}
          MIQAT_SIGNING_PASSWORD: ${{ secrets.MIQAT_SIGNING_PASSWORD }}
        run: |
          set -eu
          test -n "$MIQAT_SIGNING_KEYSTORE_BASE64" && test -n "$MIQAT_SIGNING_PASSWORD"
          umask 077
          key="$RUNNER_TEMP/miqat-release.keystore"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$MIQAT_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key"
          mkdir -p state/unsigned-release state/release
          cp state/downloads/android/miqat-release-unsigned.apk state/unsigned-release/miqat.apk
          cp state/downloads/android/miqat-installer-release-unsigned.apk state/unsigned-release/miqat-installer.apk
          cp state/downloads/phone/companion-release-unsigned.apk state/unsigned-release/miqat-phone.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          while read -r filename alias; do
            "$tools/zipalign" -P 16 -f 4 "state/unsigned-release/$filename" "$RUNNER_TEMP/aligned-$filename"
            "$tools/apksigner" sign --ks "$key" --ks-key-alias "$alias" \
              --ks-pass env:MIQAT_SIGNING_PASSWORD --key-pass env:MIQAT_SIGNING_PASSWORD \
              --out "state/release/$filename" "$RUNNER_TEMP/aligned-$filename"
          done < <(python3 -c 'import json; c=json.load(open("tools/release-certificates.json")); [print(name, entry["alias"]) for name, entry in c.items()]')
          python3 tools/check_android_release.py "$tools" state/release/miqat.apk state/release/miqat-phone.apk state/release/miqat-installer.apk
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/miqat-release.keystore"
      - name: Prepare the verified build files and checksums
        run: |
          cp state/downloads/webos/*.ipk state/release/
          python3 tools/check_apk_media.py state/release/miqat.apk
          python3 tools/check_apk_media.py state/release/miqat-phone.apk
          (cd state/release && sha256sum -- miqat.apk miqat-installer.apk miqat-phone.apk ./*.ipk > SHA256SUMS)
          cat > state/release-notes.md <<EOF
          Miqat preview builds for Android phones, Android TV / Google TV and LG webOS, plus the optional standalone TV installer.

          Validation: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID

          Android APKs are release builds signed with persistent Miqat keys. Moving from an older debug-signed preview requires a fresh install once; future releases retain their signing identity.

          SHA256SUMS covers all four packages. Source: $GITHUB_SHA.
          EOF
      - name: Create a draft; do not publish a stable release
        run: |
          gh release create "$RELEASE_TAG" state/release/miqat.apk state/release/miqat-installer.apk state/release/miqat-phone.apk state/release/*.ipk state/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Miqat $RELEASE_TAG" --notes-file state/release-notes.md

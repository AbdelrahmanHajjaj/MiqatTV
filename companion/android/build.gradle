plugins { id 'com.android.application' }

def adhanSources = configurations.create('adhanSources') {
    canBeConsumed = false
    transitive = false
}
def generatedAdhan = layout.buildDirectory.dir('generated/adhan')
def unpackAdhan = tasks.register('unpackAdhanSources', Sync) {
    from({ zipTree(adhanSources.singleFile) }) {
        include '**/*.java'
        exclude 'com/batoulapps/adhan/data/CalendarUtil.java'
    }
    into generatedAdhan
}

android {
    namespace 'tv.miqat.companion'
    compileSdk 34
    defaultConfig {
        applicationId 'tv.miqat.companion'
        minSdk 26
        targetSdk 34
        versionCode 32
        versionName '0.5.16'
        testInstrumentationRunner 'tv.miqat.companion.CompanionCheck'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The in-app language choice must remain available offline.
    bundle { language { enableSplit = false } }
    packaging.resources.excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
    sourceSets.main {
        java.srcDir generatedAdhan
        java.srcDir file('../../platforms/android-tv/src/main/java/com/batoulapps/adhan/data')
        java.srcDir file('../android-shared/src/main/java')
        assets.srcDir file('../android-shared/src/main/assets')
        // Reuse the pinned astronomy notices alongside its existing shared source adapter.
        assets.srcDir file('../../platforms/android-tv/src/main/assets')
        assets.srcDir file('../protocol')
        assets.srcDir layout.buildDirectory.dir('generated/companion')
        assets.srcDir file('../../shared/design/assets')
        assets.srcDir file('../../shared/design/phone')
        assets.srcDir file('../../shared/media')
        res.srcDir file('../../shared/design/resources')
        res.srcDir layout.buildDirectory.dir('generated/companion-res')
    }
}
dependencies {
    add(adhanSources.name, 'com.batoulapps.adhan:adhan:1.2.1:sources')
    implementation project(':installer-runtime')
    implementation 'tv.miqat:companion-core'
    implementation 'tv.miqat:core'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.github.mwiede:jsch:2.28.8'
}
tasks.withType(JavaCompile).configureEach { dependsOn(unpackAdhan) }
def generateCompanion = tasks.register('generateCompanion', Exec) {
    inputs.files(file('../generate.mjs'), file('../icons.mjs'), file('../contract.json'), file('../strings.json'), file('../protocol/lan.json'), file('../../tools/ui-contract.mjs'))
    inputs.dir file('../../shared/data')
    inputs.dir file('../../shared/design')
    inputs.file file('../../shared/design/mihrab/tokens.json')
    inputs.files file('../../platforms/android-tv/src/androidTest/assets/ui-gaps.json'), file('../../platforms/android-tv/src/androidTest/assets/ui-choice-gaps.json'), file('../../platforms/webos/ui-gaps.json'), file('../../platforms/webos/ui-choice-gaps.json')
    outputs.file layout.buildDirectory.file('generated/companion/catalog.json')
    outputs.file layout.buildDirectory.file('generated/companion/phone.json')
    outputs.dir layout.buildDirectory.dir('generated/companion-res')
    commandLine 'node', file('../generate.mjs')
}
def checkCompanionMedia = tasks.register('checkCompanionMedia', Exec) {
    onlyIf { file('../../shared/media/adhan').isDirectory() }
    commandLine 'node', file('../../tools/prepare-adhans.mjs'), '--check'
}
tasks.named('preBuild') { dependsOn(generateCompanion, checkCompanionMedia) }
